name: Build and publish releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            script: build:release:linux
            args: ''
            artifacts: |
              dist/*.AppImage
              dist/*.deb
          - os: windows-latest
            platform: windows
            arch: x64
            script: build:release:win
            args: ''
            artifacts: dist/*.exe
          - os: macos-15-intel
            platform: macos
            arch: x64
            script: build:release:mac
            args: '-- --x64'
            artifacts: |
              dist/*.dmg
              dist/*.zip
          - os: macos-15-intel
            platform: macos
            arch: arm64
            script: build:release:mac
            args: '-- --arm64'
            artifacts: |
              dist/*.dmg
              dist/*.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package app
        shell: bash
        run: |
          # dmg creation on the macOS runners intermittently dies with
          # "hdiutil: couldn't eject disk2 - Resource busy", so packaging is
          # retried after detaching whatever image the failed run left mounted.
          for attempt in 1 2 3; do
            echo "Packaging attempt $attempt"
            if npm run ${{ matrix.script }} ${{ matrix.args }}; then
              echo "Packaging succeeded"
              exit 0
            fi
            echo "::warning::Packaging attempt $attempt failed"
            if [ "$RUNNER_OS" = "macOS" ]; then
              for dev in $(hdiutil info | awk '/\/dev\/disk/ {print $1}'); do
                hdiutil detach -force "$dev" >/dev/null 2>&1 || true
              done
            fi
            rm -rf dist
          done
          echo "::error::Packaging failed after 3 attempts"
          exit 1

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: inkwell-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach installers to release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
